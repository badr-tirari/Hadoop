services:
  master:
    container_name: hadoop-master
    build:
      context: .
      dockerfile: Dockerfile.debian
    image: hadoop-cluster-base:latest
    hostname: hadoop-master
    ports:
      - "9870:9870"
      - "8088:8088"
      - "16010:16010"
      - "9000:9000"
      - "9090:9090"
      - "9091:9091"
      - "10000:10000"
      - "10002:10002"
    volumes:
      - hdfs-namenode:/data/hdfs/namenode
      - zookeeper-data:/data/zookeeper
      - ./src:/home/src
      - ./scripts/master/:/home/
      # Derby ne supporte pas les bind mounts Windows (verrous db.lck) :
      # le metastore vit sur un volume Docker nommé, monté par-dessus /home.
      - hive-metastore:/home/metastore_db
    environment:
      - ROLE=master
    networks:
      hadoop-net:
        ipv4_address: 172.30.0.10
    # 2.6g : 9 JVM sur le master (ZK, NN, SNN, RM, JobHistory, HMaster,
    # Thrift, REST, HiveServer2) — 1.8g suffisait sans Hive.
    mem_limit: 2.6g
    cpus: 1.5

  slave1:
    container_name: hadoop-slave1
    image: hadoop-cluster-base:latest
    hostname: hadoop-slave1
    ports:
      - "8041:8042"
    volumes:
      - hdfs-datanode-1:/data/hdfs/datanode
    environment:
      - ROLE=slave
    depends_on:
      master:
        condition: service_started
    networks:
      hadoop-net:
        ipv4_address: 172.30.0.20
    mem_limit: 0.8g
    cpus: 1

  slave2:
    container_name: hadoop-slave2
    image: hadoop-cluster-base:latest
    hostname: hadoop-slave2
    ports:
      - "8042:8042"
    volumes:
      - hdfs-datanode-2:/data/hdfs/datanode
    environment:
      - ROLE=slave
    depends_on:
      master:
        condition: service_started
    networks:
      hadoop-net:
        ipv4_address: 172.30.0.30
    mem_limit: 0.8g
    cpus: 1

  # NiFi : ingestion visuelle (séquence 07 du cours).
  # Image officielle 2.x : HTTPS obligatoire (self-signed) sur 8443 —
  # le navigateur demandera d'accepter le certificat une fois. Java 21
  # embarqué, client Hadoop 3.x compatible avec notre Hadoop 3.3.6.
  # UI sur https://localhost:8443/nifi
  nifi:
    container_name: hadoop-nifi
    image: apache/nifi:2.11.0
    hostname: hadoop-nifi
    ports:
      - "8443:8443"
    environment:
      - NIFI_WEB_HTTPS_PORT=8443
      - NIFI_WEB_HTTPS_HOST=0.0.0.0
    volumes:
      # Répertoire d'entrée des fichiers à ingérer (TP : GetFile)
      - ./nifi/input:/opt/nifi/input
      # Configuration Hadoop du cluster (copiée depuis config/, voir README)
      - ./nifi/hadoop:/opt/nifi/hadoop
    networks:
      hadoop-net:
        ipv4_address: 172.30.0.40
    mem_limit: 1g
    cpus: 1
    depends_on:
      master:
        condition: service_started

volumes:
  hdfs-namenode:
  hdfs-datanode-1:
  hdfs-datanode-2:
  zookeeper-data:
  hive-metastore:

networks:
  hadoop-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
